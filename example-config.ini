[djicot]
; DJICOT example configuration. Parameters use ALL CAPS (PyTAK convention).

; --- AntSDR input feed (selects worker by URL scheme/port) ---
; Binary DJI Drone ID frames (default AntSDR port):
FEED_URL = tcp://192.168.1.10:41030
; Text CSV debug stream (AntSDR port 52002):
; FEED_URL = tcp://192.168.1.10:52002
; Offline replay from a captured log file:
; FEED_URL = file:///path/to/dji_o_capture.log
; FEED_FORMAT = text

; --- CoT output (required for TAK) ---
COT_URL = udp+wo://239.2.3.1:6969

; --- Sensor position (required for range-only detections) ---
SENSOR_LAT = 37.76
SENSOR_LON = -122.4975
SENSOR_ALT = 50
SENSOR_ID = DJICOT
SENSOR_COT_TYPE = a-f-G-E-S-E

; --- CoT identity / types ---
UAS_COT_TYPE = a-u-A-M-H-Q
OP_COT_TYPE = a-u-G-U-C
; COT_STALE = 3600
; COT_HOST_ID =

; --- PyTAK transport / TLS (TAK Server) — see https://pytak.rtfd.io/en/latest/configuration/ ---
; PYTAK_TLS_CLIENT_CERT =
; PYTAK_TLS_CLIENT_KEY =
; PYTAK_TLS_CLIENT_PASSWORD =
; PYTAK_TLS_CERT_ENROLLMENT_USERNAME =
; PYTAK_TLS_CERT_ENROLLMENT_PASSWORD =
; PYTAK_TLS_CERT_ENROLLMENT_PASSPHRASE =
; PYTAK_NO_HELLO = 0
; DEBUG = 0
